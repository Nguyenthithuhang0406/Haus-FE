<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Security: Content Security Policy -->
    <!-- Protects against XSS, inline script injection, unauthorized resource loading -->
    <meta http-equiv="Content-Security-Policy" 
      content="
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval' 'unsafe-inline' https://kit.fontawesome.com;
        style-src 'self' 'unsafe-inline' https://ka-f.fontawesome.com;
        img-src 'self' data: https:;
        font-src 'self' https://ka-f.fontawesome.com data:;
        connect-src 'self' https: http: ws: wss:;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
        upgrade-insecure-requests
      " />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + React</title>
    <script src="https://kit.fontawesome.com/1720444cd0.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
